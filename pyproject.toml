[project]
name = "student-rag"
version = "0.1.0"
description = "Local hybrid RAG research assistant over synthetic student data"
readme = "README.md"
authors = [
    { name = "DymanoXAdd", email = "51493949+DymanoXAdd@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix>=21.0.0",
    "arize-phoenix-otel>=0.17.3",
    "chromadb>=1.5.9",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
student-rag = "student_rag:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# ldap3 (pulled in by arize-phoenix) uses deprecated pyasn1 names; not our code
filterwarnings = ["ignore::DeprecationWarning:ldap3.*"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
